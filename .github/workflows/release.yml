name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      UV_FROZEN: "1"
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the history and the tags
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG version=$version"
          test "$TAG" = "v$version"

      - name: Tests must pass on the tagged commit
        run: |
          uv sync --group dev --extra duckdb --extra postgres
          uv run ruff check
          uv run ruff format --check
          uv run pytest -q

      - run: uv build
      - name: The wheel must carry LICENSE and NOTICE
        run: python -m zipfile -l dist/*.whl | grep -E "LICENSE|NOTICE"

      - name: Release notes for this tag
        run: uv run git-cliff --current --strip all --output RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Draft a release with the notes and the built files
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft, so the notes can be read and edited before anyone sees the release.
        run: gh release create "$TAG" dist/* --draft --title "$TAG" --notes-file RELEASE_NOTES.md

  publish-pypi:
    needs: release
    # Publishing is off until the project is ready for it. Turn it on by setting the
    # repository variable PUBLISH_TO_PYPI to true (Settings, Secrets and variables, Actions).
    # It also needs a PyPI trusted publisher for this repository and an environment named
    # pypi; no API token is stored anywhere.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
