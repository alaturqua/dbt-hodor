# Changelog generation. See https://git-cliff.org
# Local: uv run git-cliff --output CHANGELOG.md
# The release workflow uses `--current` to write the notes for one tag.

[changelog]
header = """
# Changelog

All notable changes to dbt-hodor. The format follows [Keep a Changelog](https://keepachangelog.com),
and the project follows [semantic versioning](https://semver.org).

Until 1.0 the settings and the record schema may change in a minor release.
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
# Commits that are not conventional still appear, so nothing is silently dropped.
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

commit_parsers = [
  # Merge commits say nothing a reader needs.
  { message = "^Merge ", skip = true },
  # A wrong reuse is this project's most serious defect class, so it gets its own heading.
  { message = "^fix\\(reuse\\)", group = "Correctness: reuse decisions" },
  { message = "^fix\\(correctness\\)", group = "Correctness: reuse decisions" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^(build|ci)", group = "Build and CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  # Dependabot prefixes its commits with "deps" and "ci".
  { message = "^deps", group = "Dependencies" },
  { message = "^chore", group = "Other" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", group = "Other" },
]

commit_preprocessors = [
  # Link issue references.
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/alaturqua/dbt-hodor/issues/${1}))" },
]
