site_name: dbt-hodor
site_description: Hold Old Data, Or Rebuild
site_url: https://alaturqua.github.io/dbt-hodor/
docs_dir: docs
copyright: Apache-2.0

repo_url: https://github.com/alaturqua/dbt-hodor
repo_name: alaturqua/dbt-hodor
edit_uri: edit/main/docs/

theme:
  name: material
  font: false # system fonts: no request to Google Fonts
  logo: assets/hodor-icon.svg # small raven mark for the dark header, both schemes
  favicon: assets/favicon.svg # follows the browser color scheme
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alaturqua/dbt-hodor
      name: dbt-hodor on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/isainalcik/
      name: Isa Inalcik on LinkedIn
  # No analytics and no cookie consent: the site makes no third-party requests.

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works:
      - Run flow: how-it-works/run-flow.md
      - Decision rules: how-it-works/decision-rules.md
      - Hashing: how-it-works/hashing.md
      - Data versions: how-it-works/data-versions.md
      - Lineage: how-it-works/lineage.md
  - Guides:
      - Configuration: configuration.md
      - State stores: stores.md
      - Operations: operations.md
      - Slim CI: slim-ci.md
      - Upgrading: upgrading.md
  - Interactive guide: guide/index.html
  - Reference:
      - Design spec: design.md
      - Development: development.md
      - License: license.md
