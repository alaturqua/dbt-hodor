<text x="62" y="179" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">stg_orders</text>
<text x="62" y="195" font-size="11" font-weight="400" fill="#4d5361" text-anchor="start">table</text>
<rect x="250" y="80" width="170" height="44" rx="6" fill="#fbfaf7" stroke="#d4cfc4"/>
<text x="262" y="99" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">int_orders</text>
<text x="262" y="115" font-size="11" font-weight="400" fill="#4d5361" text-anchor="start">view</text>
<rect x="250" y="160" width="170" height="44" rx="6" fill="#fbfaf7" stroke="#d4cfc4"/>
<text x="262" y="179" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">fct_orders</text>
<text x="262" y="195" font-size="11" font-weight="400" fill="#4d5361" text-anchor="start">table</text>
