<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">dbt-hodor in slim CI</title>
<desc id="d">A pull request builds into its schema in the CI catalog. The changed model and its child build there and read unchanged parents from the base target through defer. hodor keeps the PR's build records apart from the base target's. The next push reuses everything; new base data makes the PR's models build again.</desc>
<defs>
<marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f9c"/></marker>
<marker id="m-built" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a61e22"/></marker>
<marker id="m-clone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
</defs>
<rect x="20" y="20" width="430" height="360" rx="10" fill="#ebe8e1"/>
<text x="40" y="48" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">base target</text>
<text x="40" y="66" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">analytics.sales</text>
<rect x="530" y="20" width="410" height="360" rx="10" fill="#ebe8e1"/>
<text x="550" y="48" font-size="15" font-weight="700" fill="#1f2430" text-anchor="start">CI target, one pull request</text>
<text x="550" y="66" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">analytics_ci.&lt;ci_schema&gt;</text>
<line x1="135" y1="124" x2="135" y2="158" stroke="#8a8f9c" stroke-width="1.6" marker-end="url(#m-line)"/>
<line x1="220" y1="182" x2="248" y2="104" stroke="#8a8f9c" stroke-width="1.6" marker-end="url(#m-line)"/>
<line x1="335" y1="124" x2="335" y2="158" stroke="#8a8f9c" stroke-width="1.6" marker-end="url(#m-line)"/>
<line x1="220" y1="182" x2="248" y2="260" stroke="#8a8f9c" stroke-width="1.6" marker-end="url(#m-line)"/>
<rect x="50" y="80" width="170" height="44" rx="6" fill="#fbfaf7" stroke="#d4cfc4"/>
<text x="62" y="99" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">raw_orders</text>
<text x="62" y="115" font-size="11" font-weight="400" fill="#4d5361" text-anchor="start">source</text>
