<text x="262" y="259" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">dim_parity</text>
<text x="262" y="275" font-size="11" font-weight="400" fill="#4d5361" text-anchor="start">table</text>
<line x1="645" y1="124" x2="645" y2="158" stroke="#a61e22" stroke-width="1.6" marker-end="url(#m-built)"/>
<rect x="560" y="80" width="170" height="44" rx="6" fill="#fbfaf7" stroke="#d4cfc4"/>
<text x="572" y="99" font-size="13" font-weight="600" fill="#1f2430" text-anchor="start">fct_orders</text>
