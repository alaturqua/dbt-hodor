<text x="692" y="186" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">BUILT</text>
<line x1="420" y1="102" x2="558" y2="102" stroke="#a61e22" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m-built)"/>
<text x="490" y="94" font-size="11" font-weight="600" fill="#a61e22" text-anchor="middle">--defer</text>
<rect x="50" y="320" width="370" height="40" rx="6" fill="none" stroke="#d4cfc4" stroke-dasharray="4 3"/>
<text x="62" y="345" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">hodor_state: the base target's records</text>
<rect x="560" y="320" width="370" height="40" rx="6" fill="none" stroke="#d4cfc4" stroke-dasharray="4 3"/>
<text x="572" y="345" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">hodor_state: this PR's records</text>
<rect x="20" y="410" width="290" height="90" rx="10" fill="#fbfaf7" stroke="#d4cfc4"/>
<rect x="20" y="410" width="5" height="90" rx="2" fill="#a61e22"/>
<text x="40" y="438" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">Push 1</text>
<text x="40" y="462" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">the changed model builds,</text>
<text x="40" y="482" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">and its children</text>
<line x1="313" y1="455" x2="327" y2="455" stroke="#8a8f9c" stroke-width="1.6" marker-end="url(#m-line)"/>
<rect x="330" y="410" width="290" height="90" rx="10" fill="#fbfaf7" stroke="#d4cfc4"/>
<rect x="330" y="410" width="5" height="90" rx="2" fill="#4d5361"/>
<text x="350" y="438" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">Push 2, same code</text>
<text x="350" y="462" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">no new data upstream</text>
<text x="350" y="482" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">everything is reused</text>
<line x1="623" y1="455" x2="637" y2="455" stroke="#8a8f9c" stroke-width="1.6" marker-end="url(#m-line)"/>
<rect x="640" y="410" width="290" height="90" rx="10" fill="#fbfaf7" stroke="#d4cfc4"/>
<rect x="640" y="410" width="5" height="90" rx="2" fill="#a61e22"/>
<text x="660" y="438" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">Base gets new data</text>
<text x="660" y="462" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">the base job runs</text>
<text x="660" y="482" font-size="12" font-weight="400" fill="#4d5361" text-anchor="start">the PR's models build again</text>
</svg>
